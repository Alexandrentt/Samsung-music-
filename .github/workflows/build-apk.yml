name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Add gradlew wrapper (repo has no committed wrapper script)
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 9.3.1 --no-daemon
          fi

      - name: Build APK (Release & Debug)
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradlew ]; then
            ./gradlew :app:assembleRelease :app:assembleDebug --no-daemon
          else
            gradle :app:assembleRelease :app:assembleDebug --no-daemon
          fi

      # Los pasos de publicación corren en main, master o workflow_dispatch
      - name: Copy APK to repository root
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk samsung-music-release.apk
            cp app/build/outputs/apk/release/app-release.apk samsung-music.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk samsung-music.apk
          fi
          ls -la samsung-music*.apk

      - name: Commit APK to repository root
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samsung-music*.apk
          if git diff --cached --quiet; then
            echo "APK sin cambios, no hay nada que commitear."
          else
            git commit -m "build: actualizar APK release [skip ci]"
            git push
          fi

      - name: Delete in-progress release (if rerun)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        run: |
          VERSION="v$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1).${{ github.run_number }}"
          gh release delete "$VERSION" --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        run: |
          VERSION="v$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1).${{ github.run_number }}"
          FILES="samsung-music.apk"
          if [ -f samsung-music-release.apk ]; then
            FILES="samsung-music.apk samsung-music-release.apk"
          fi
          gh release create "$VERSION" $FILES \
            --title "Música $VERSION" \
            --notes "APK de Música generado automáticamente por GitHub Actions.

          Novedades:
          - Actualización en el sitio: misma firma y applicationId, tus canciones NO se pierden
          - Descargas en la carpeta compartida /Music/SamsungMusic (fuera de Android/data)
          - Migración automática de canciones antiguas hacia /Music/SamsungMusic
          - Detección inteligente de canciones existentes y dedupe de duplicados
          - Interfaz One UI, barra de reproducción persistente y aleatorio real" \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
